:root{--ink:#26332b;--forest:#165a3a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'JK',system-ui,sans-serif;color:var(--ink);
 background:linear-gradient(165deg,#fcf9e6 0%,#eff6d9 45%,#e1f3e4 100%);
 display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 16px 18px}
.top{width:min(100%,520px)}
.toprow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.deckname{font-family:'PF',serif;font-style:italic;font-weight:600;font-size:clamp(19px,4.8vw,26px);color:var(--forest)}
.count{font-weight:800;font-size:15px;letter-spacing:1px;color:var(--forest);white-space:nowrap}
.bar{height:8px;border-radius:6px;background:rgba(22,90,58,.15);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--forest);border-radius:6px;transition:width .35s}
.scene{width:min(100%,520px);aspect-ratio:5/4;perspective:1400px}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1);cursor:pointer;
 --bd:#6aa84f;--g1:#f4fbdc;--g2:#dcf2bd;--tag:#165a3a}
.card[data-type=prefix]{--bd:#e5894a;--g1:#fff1e3;--g2:#fcd8b6;--tag:#b94a14}
.card[data-type=suffix]{--bd:#9a86c9;--g1:#f4effc;--g2:#dcd2f2;--tag:#684ca3}
.card.flipped{transform:rotateY(180deg)}
.card.quick{transition-duration:.28s}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--bd);border-radius:28px;
 background:linear-gradient(180deg,var(--g1),var(--g2));padding:5%;display:flex;flex-direction:column;box-shadow:0 10px 24px rgba(22,90,58,.16)}
.back{transform:rotateY(180deg)}
.facehead{display:flex;justify-content:space-between;align-items:center}
.tag{background:var(--tag);color:#fff;font-weight:800;font-size:12px;letter-spacing:2px;text-transform:uppercase;border-radius:8px;padding:5px 12px}
.side{font-weight:800;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--tag);opacity:.8}
.part{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'PF',serif;font-weight:800;color:var(--tag);font-size:clamp(64px,22vw,140px);line-height:1}
.part.mid{font-size:clamp(46px,14vw,92px)}
.part.long{font-size:clamp(34px,10vw,62px)}
.guess{display:flex;flex-direction:column;gap:6px}
.guess label{font-weight:800;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--tag)}
.guess input{font:600 clamp(16px,4vw,20px) 'JK',sans-serif;padding:10px 14px;border:3px solid var(--bd);border-radius:14px;background:#fffef6;color:var(--ink);width:100%}
.guess input:focus{outline:3px solid #bfe68a;outline-offset:2px}
.bands{flex:1;display:flex;flex-direction:column;margin-top:10px;min-height:0}
.band{flex:1;border:3px solid #3a4a40;margin-top:-3px;display:flex;align-items:center;justify-content:center;text-align:center;
 font-weight:600;font-size:clamp(16px,4.6vw,26px);line-height:1.2;padding:4px 10px}
.band:first-child{margin-top:0;border-radius:16px 16px 0 0}
.band:last-child{border-radius:0 0 16px 16px}
.band span{text-wrap:balance}
.band m{background:#ffd84d;font-weight:800;border-radius:4px;box-shadow:0 0 0 3px #ffd84d;color:#1f2a24;margin:0 4px}
.band m.b{background:#ffb3cd;box-shadow:0 0 0 3px #ffb3cd;text-decoration:underline dotted #8a2447 2px;text-underline-offset:5px}
.y{background:#fdf1a8}.b{background:#cfe6fb}.g{background:#d0f0c6}
.yours{font-weight:600;font-size:clamp(13px,3.4vw,16px);margin-top:8px;min-height:1.3em;color:var(--tag)}
.yours b{font-weight:800}
.nav{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
button,.chooser a{font:800 15px 'JK',sans-serif;letter-spacing:1px;text-transform:uppercase;background:var(--forest);color:#f1f8e4;border:0;border-radius:14px;padding:12px 22px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.chooser a:hover{background:#0f4a33}
button.alt{background:transparent;color:var(--forest);border:3px solid var(--forest);padding:9px 18px}
button.alt:hover{background:rgba(22,90,58,.1)}
button.small{font-size:12px;padding:7px 14px;border-width:2px}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,.chooser a:focus-visible{outline:3px solid #bfe68a;outline-offset:3px}
.hint{font-size:13px;font-weight:600;color:#4a5a50;text-align:center;min-height:1.2em}
.chooser{display:none;flex-direction:column;gap:12px;align-items:center;margin-top:30px}
.chooser h1{font-family:'PF',serif;font-style:italic;font-weight:600;font-size:28px;color:var(--forest)}
.chooser a{width:260px;text-align:center}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (prefers-reduced-motion:reduce){.card,.card.quick,.bar i{transition:none}}
</style>
</head>

</div>

<div class="nav">
  <button class="alt" id="prev" type="button">&larr; Back</button>

  <button class="alt" id="next" type="button">Next &rarr;</button>
</div>
<div class="nav">
  <button class="alt small" id="shuffle" type="button">Shuffle</button>
  <button class="alt small" id="restart" type="button">Restart</button>
</div>
<div class="hint" id="hint">Guess first. Enter flips the card. Arrow keys move between cards.</div>
<div class="sr" id="live" aria-live="polite"></div>
</div>

var DECKS = {

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.title = deck.title + ': Root Word Boot Camp';
  $('deckname').textContent = deck.title;

  function setFlipped(on, quick){
    card.classList.toggle('quick', !!quick);

    flipBtn.setAttribute('aria-pressed', on ? 'true' : 'false');

  }

  function go(to){
    if (to < 0 || to > cards.length-1 || to === i) return;

    if (flipped) { setFlipped(false, true); if (reduce) swap(); else setTimeout(swap, 300); } else { swap(); }
  }

  document.addEventListener('keydown', function(e){
    if (e.target === guess || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key==='ArrowRight') go(i+1); else if (e.key==='ArrowLeft') go(i-1);
  });

  makeOrder(params.get('shuffle')==='1' || !!deck.shuffle);
  paint(); setFlipped(false,true);
}
</script>
</body>
</html>
